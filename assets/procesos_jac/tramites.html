<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Trámites JAC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">
	<link rel="stylesheet" href="../humana-modulos.css">
</head>
<body class="libro-humana">
	<div class="book-layout">
		<section class="tramites-layout libro-surface" data-js="tramites-layout">
			<header class="ledger-hero tramites-hero">
				<div>
					<p class="ledger-breadcrumb">Procesos administrativos · JAC Providencia</p>
					<h1>Gestión de trámites</h1>
					<p class="ledger-subtitle">Consulta, filtra y crea solicitudes comunitarias en un solo lugar.</p>
				</div>
				<div class="tramites-hero__actions">
					<label class="ledger-search" aria-label="Buscar trámites">
						<i class="ri-search-line" aria-hidden="true"></i>
						<input type="search" placeholder="Buscar por asunto o estado" data-js="tramites-search" aria-label="Buscar trámite">
					</label>
					<button class="btn primary" type="button" data-js="tramites-new"><i class="ri-add-line"></i>Nuevo trámite</button>
				</div>
			</header>

			<section class="ledger-metrics tramites-metrics" aria-label="Estado de los trámites">
				<article class="metric-card">
					<p class="metric-label">En proceso</p>
					<p class="metric-value" data-metric="pending">0</p>
					<p class="metric-caption">Seguimiento activo</p>
				</article>
				<article class="metric-card">
					<p class="metric-label">Aprobados</p>
					<p class="metric-value" data-metric="approved">0</p>
					<p class="metric-caption">Listos para entrega</p>
				</article>
				<article class="metric-card">
					<p class="metric-label">Rechazados</p>
					<p class="metric-value" data-metric="rejected">0</p>
					<p class="metric-caption">Requieren ajustes</p>
				</article>
			</section>

			<nav class="tramites-tabs" data-js="tramites-tabs" aria-label="Filtros de estado">
				<button class="tramites-tab is-active" type="button" data-filter="pendientes">En proceso</button>
				<button class="tramites-tab" type="button" data-filter="aprobados">Aprobados</button>
				<button class="tramites-tab" type="button" data-filter="rechazados">Rechazados</button>
			</nav>

			<section class="tramites-grid" aria-label="Categorías de trámites">
				<button class="tramites-card is-active" type="button" data-category="todos">
					<i class="ri-dashboard-2-line" aria-hidden="true"></i>
					<span>Todos</span>
				</button>
				<button class="tramites-card" type="button" data-category="documentos">
					<i class="ri-file-list-2-line" aria-hidden="true"></i>
					<span>Documentos</span>
				</button>
				<button class="tramites-card" type="button" data-category="financieros">
					<i class="ri-database-2-line" aria-hidden="true"></i>
					<span>Financieros</span>
				</button>
				<button class="tramites-card" type="button" data-category="comunitarios">
					<i class="ri-leaf-line" aria-hidden="true"></i>
					<span>Comunitarios</span>
				</button>
				<button class="tramites-card" type="button" data-category="proyectos">
					<i class="ri-tools-line" aria-hidden="true"></i>
					<span>Proyectos</span>
				</button>
				<button class="tramites-card" type="button" data-category="afiliacion">
					<i class="ri-user-add-line" aria-hidden="true"></i>
					<span>Afiliación</span>
				</button>
				<button class="tramites-card" type="button" data-category="certificados">
					<i class="ri-stamp-line" aria-hidden="true"></i>
					<span>Certificados</span>
				</button>
			</section>

			<section class="tramites-list" aria-label="Listado de trámites">
				<header class="tramites-list__header">
					<p class="tramites-count" data-js="tramites-count">0 trámites</p>
				</header>
				<ul class="tramites-items" data-js="tramites-list"></ul>
			</section>
		</section>
	</div>
	<script src="tramites.js" defer></script>
</body>
</html>
