<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bandeja de Entrada · JAC Providencia</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet">
	<link rel="stylesheet" href="../humana-modulos.css">
</head>
<body class="libro-humana">
	<div class="book-layout">
		<div class="inbox-shell libro-surface" data-js="inbox-shell">
			<header class="ledger-hero inbox-hero">
				<div>
					<p class="ledger-breadcrumb">Bandeja · JAC Providencia</p>
					<h1>Bandeja de entrada</h1>
					<p class="ledger-subtitle">Documentos, votaciones, mensajes y alertas en un solo lugar.</p>
				</div>
				<div class="ledger-hero-actions inbox-hero__actions">
					<label class="ledger-search inbox-search" aria-label="Buscar en la bandeja">
						<i class="ri-search-line" aria-hidden="true"></i>
						<input type="search" placeholder="Buscar por palabra clave" data-js="inbox-search" aria-label="Buscar en la bandeja">
					</label>
					<button class="btn primary" type="button" data-js="new-message"><i class="ri-edit-line"></i>Nuevo mensaje</button>
				</div>
			</header>

			<section class="ledger-metrics inbox-metrics" aria-label="Resumen rápido">
				<article class="metric-card">
					<p class="metric-label">Pendientes</p>
					<p class="metric-value" data-metric="pending">0</p>
				</article>
				<article class="metric-card">
					<p class="metric-label">Votos abiertos</p>
					<p class="metric-value" data-metric="votes">0</p>
				</article>
				<article class="metric-card">
					<p class="metric-label">Pagos</p>
					<p class="metric-value" data-metric="payments">0</p>
				</article>
			</section>

			<section class="inbox-quickbar" aria-label="Filtros rápidos">
				<p class="inbox-quickbar__label">Filtros rápidos</p>
				<div class="inbox-filter-chipset" data-js="inbox-quickfilters">
					<button type="button" class="inbox-chip" data-quick="nuevo"><i class="ri-fire-line"></i>Nuevo</button>
					<button type="button" class="inbox-chip" data-quick="importante"><i class="ri-error-warning-line"></i>Importante</button>
					<button type="button" class="inbox-chip" data-quick="verificado"><i class="ri-shield-check-line"></i>Verificado</button>
				</div>
			</section>

			<nav class="inbox-tabs" data-js="inbox-tabs" aria-label="Categorías bandeja">
				<button class="inbox-tab is-active" type="button" data-filter="todos">Documentos</button>
				<button class="inbox-tab" type="button" data-filter="votaciones">Votaciones</button>
				<button class="inbox-tab" type="button" data-filter="mensajes">Mensajes</button>
				<button class="inbox-tab" type="button" data-filter="alertas">Alertas</button>
				<button class="inbox-tab" type="button" data-filter="pagos">Pagos</button>
				<button class="inbox-tab" type="button" data-filter="jac">JAC</button>
			</nav>

			<section class="inbox-list" aria-label="Listado de comunicaciones">
				<ul class="inbox-items" data-js="inbox-list"></ul>
			</section>
		</div>
	</div>

	<script src="bandeja.js" defer></script>
</body>
</html>
